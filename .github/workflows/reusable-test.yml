name: Reusable Test Workflow

on:
  workflow_call:
    inputs:
      username:
        description: "A simple test input string"
        required: false
        type: string
        default: "World"
      appconfig_path:
        description: "Path to the appconfig.yml file"
        required: false
        type: string
        default: "appconfig.yml"
      environment:
        description: "GitHub environment (e.g. Dev or Prod)"
        required: true
        type: string

jobs:
  test-job:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Print greeting
        run: echo "Hello, ${{ inputs.username }}! Running in environment ${{ inputs.environment }}"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate Kubernetes Secret Manifest
        env:
          APPCONFIG_PATH: ${{ inputs.appconfig_path }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          python - << 'EOF'
          import yaml
          import sys
          import os
          import json

          filepath = os.environ.get('APPCONFIG_PATH', 'appconfig.yml')
          
          if not os.path.exists(filepath):
              print(f'Error: Config file not found at {filepath}')
              sys.exit(1)

          with open(filepath, 'r') as f:
              config = yaml.safe_load(f)

          try:
              github_secrets = json.loads(os.environ.get('SECRETS_JSON', '{}'))
              print(f"Debug: Loaded {len(github_secrets)} secrets. Keys available: {[k for k in github_secrets.keys() if k != 'github_token']}")
          except Exception as e:
              print(f"Error parsing secrets json: {e}")
              github_secrets = {}

          try:
              github_vars = json.loads(os.environ.get('VARS_JSON', '{}'))
              print(f"Debug: Loaded {len(github_vars)} variables. Keys available: {list(github_vars.keys())}")
          except Exception as e:
              print(f"Error parsing vars json: {e}")
              github_vars = {}

          groups = config.get('groups', {})
          if not groups:
              if 'kubernetes' in config:
                  groups = {'default': config}
              else:
                  print("No 'groups' found in appconfig.yml")
                  sys.exit(0)

          for group_name, group_data in groups.items():
              if not group_data:
                  continue

              secret_name = group_data.get('kubernetes', {}).get('secret_name', f'{group_name}-secret')
              config_vars = group_data.get('github', {}).get('variables', []) or []
              config_secrets = group_data.get('github', {}).get('secrets', []) or []

              manifest = {
                  'apiVersion': 'v1',
                  'kind': 'Secret',
                  'metadata': {
                      'name': secret_name
                  },
                  'type': 'Opaque',
                  'stringData': {}
              }

              for var in config_vars:
                  manifest['stringData'][var] = github_vars.get(var, f'missing-var-{var}')

              for sec in config_secrets:
                  manifest['stringData'][sec] = github_secrets.get(sec, f'missing-secret-{sec}')

              print('---')
              print(f'# Generated Kubernetes Secret Manifest for group: {group_name}')
              print(yaml.dump(manifest, default_flow_style=False, sort_keys=False))
          EOF
